# Profiler agent configuration. Dynamic keys (marked *) are re-read every config.reloadSeconds without restarting the app.

# * Master switch
enabled=true
app.name=myapp
output.dir=./profiler-data

# Packages (prefix match) to instrument with exact timing + allocation. Servlet/Tomcat entry points and JDBC are always instrumented.
# Everything else is still covered by the sampler. Examples:
#   include=com.mycompany.,org.springframework.web.client.,org.springframework.data.
include=demo.
exclude=java.*,javax.*,jdk.*,sun.*
instrument.jdbc=true
instrument.skipTrivial=true

# * Per-trace limits (distinct call paths are merged: count / total / min / max per node)
trace.maxDepth=100
trace.maxNodes=10000
# * Drop call-tree nodes whose total time is below this (their time is folded into the parent's self time). 0 = keep all
trace.minDurationMicros=0
# * Background (non-request) tasks are only recorded when they run at least this long
background.minMillis=100

# Request context
url.maskNumericSegments=true
request.idHeaders=X-Request-ID,X-B3-TraceId,traceparent

# * Sampler (covers all threads, incl. non-instrumented code)
sampling.enabled=true
sampling.intervalMs=100
sampling.flushSeconds=30
sampling.maxDepth=64
metrics.intervalSeconds=10

# * Alerts (0 = off), written to <output.dir>/alerts.log and flagged in the UI
alert.slowMillis=0
alert.allocMB=0

# * Overhead guard: pauses instrumentation (sampling continues) if estimated overhead exceeds this % of total CPU capacity
guard.enabled=true
guard.maxOverheadPercent=10
guard.cooldownSeconds=60

# Storage
segment.maxMB=50
retention.maxTotalMB=500
retention.maxAgeHours=48
config.reloadSeconds=5